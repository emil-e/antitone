name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Package and publish
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Cache pinned native dependencies and tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/native-deps
            .cache/deps
            .cache/format-tools
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-native.sh', 'scripts/build-*.sh', 'scripts/xtask/src/main.rs') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate the tag against the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$tag" != "$crate" ]; then
            echo "Tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi
      - name: Prepare pinned dependencies and tools
        run: cargo xtask setup
      - name: Direct-SDK adapter tests
        run: "cargo test --locked --features dng-sdk --lib dng::"
      - name: Package the relocatable app
        run: cargo xtask package
      - name: Verify the relocated package
        run: cargo xtask verify-package
      - name: Create the release with the package and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Antitone $GITHUB_REF_NAME" \
            --generate-notes \
            .cache/app/Antitone-macos-arm64.zip \
            .cache/app/SHA256SUMS