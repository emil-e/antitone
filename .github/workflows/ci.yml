name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The default Xcode (16.4) ships a swift-format too old for our .swift-format
  # schema; pin the newest stable Xcode on the macos-15 image until the image moves.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  checks:
    name: format, docs and core
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned formatting tools
        run: cargo xtask tools
      - name: Authored-source formatting
        run: python3 scripts/check-format.py
      - name: Documentation links
        run: python3 scripts/check-docs.py
      - name: Packaging and format-tool tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Numerical core tests
        run: cargo test --locked --no-default-features

  editor:
    name: native build, editor and package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Cache pinned native dependencies and tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .cache/native-deps
            .cache/deps
            .cache/format-tools
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-native.sh', 'scripts/build-*.sh', 'scripts/xtask/src/main.rs') }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare pinned dependencies and tools
        run: cargo xtask setup
      - name: Direct-SDK adapter tests
        run: "cargo test --locked --features dng-sdk --lib dng::"
      - name: Production editor clippy
        run: cargo clippy --locked --features editor --all-targets -- -D warnings
      - name: All-features clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Package the relocatable app
        run: cargo xtask package
      - name: Verify the relocated package
        run: cargo xtask verify-package
      - name: Upload the local package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Antitone-macos-arm64-${{ github.sha }}
          path: .cache/app/Antitone-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7