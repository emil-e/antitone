    <linearGradient id="photo" x2="0" y2="1"><stop stop-color="#535e66"/><stop offset="1" stop-color="#252e33"/></linearGradient>
    <g id="reset" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4a6 6 0 1 1-2 5M5 1v4H1"/></g>
    <g id="fit" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 6V1h5m4 0h5v5m0 4v5h-5m-4 0H1v-5"/></g>
    <g id="eye" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8q7-10 14 0-7 10-14 0Z"/><circle cx="8" cy="8" r="2.5"/></g>
    <g id="flip" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 0v16M5 3 1 13h4Zm6 0 4 10h-4Z"/></g>
    <g id="crop" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 0v12h12M0 4h12v12"/></g>
    <g id="guide" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="1" width="14" height="14"/><path d="M6 1v14M10 1v14M1 6h14M1 10h14"/></g>
  </defs>
