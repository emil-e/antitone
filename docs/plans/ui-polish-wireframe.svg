<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title description">
  <title id="title">Antitone proposed workspace — illustrative crop mode</title>
  <desc id="description">Synthetic, nonfunctional design sketch: distinct scopes and inspector on the right, workflow tabs, collapsible sections, a contextual crop toolbar over the photo, permanent bottom viewer controls, filmstrip and deliberate status footer. Not a screenshot or final icon design.</desc>
