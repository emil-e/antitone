[alias]
app = "run --locked --release --features editor --bin antitone"
build-app = "build --locked --release --features editor --bin antitone"
xtask = "run --locked --package xtask --"

[env]
# Scope compiler selection to the implemented target, not future Windows builds.
CC_aarch64_apple_darwin = { value = "/usr/bin/clang", force = true }
CXX_aarch64_apple_darwin = { value = "/usr/bin/clang++", force = true }
