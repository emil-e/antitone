[package]
name = "antitone"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
glam = { version = "=0.34.1", default-features = false, features = ["std", "f64"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "metal", "glsl", "wgsl"] }
pollster = { version = "=1.0.1", optional = true }
bytemuck = { version = "=1.25.2", optional = true, features = ["derive"] }

egui = { version = "=0.36.2", optional = true }
egui-winit = { version = "=0.36.2", optional = true, default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "=0.36.2", optional = true, default-features = false }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06"] }
half = { version = "=2.7.1", optional = true }
lcms2 = { version = "=6.2.0", optional = true, default-features = false, features = ["static"] }
tiff = { version = "=0.11.3", optional = true }
exr = { version = "=1.74.2", optional = true }
tempfile = { version = "=3.27.0", optional = true }
libc = { version = "=0.2.190", optional = true }
rfd = { version = "=0.17.2", optional = true, default-features = false }
serde = { version = "=1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "=1.0.151", optional = true, features = ["float_roundtrip"] }
blake3 = { version = "=1.8.7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CGColorSpace"] }
objc2-quartz-core = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CAMetalLayer", "objc2-core-graphics"] }

[features]
editor = ["ui", "raw", "export", "project", "dep:rfd"]
project = ["dep:serde", "dep:serde_json", "dep:blake3", "dep:tempfile"]
ui = ["gpu", "dep:egui", "dep:egui-winit", "dep:egui-wgpu", "dep:winit", "dep:half", "dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-quartz-core"]
raw = ["dep:cc"]
render = ["dep:cc", "dep:lcms2"]
export = ["render", "dep:tiff", "dep:exr", "dep:tempfile", "dep:libc", "dep:half"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "glam/bytemuck"]

[build-dependencies]
cc = { version = "=1.2.62", optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "antitone"
path = "src/bin/antitone.rs"
required-features = ["editor"]

[[bin]]
name = "antitone-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "antitone-raw-probe"
path = "src/bin/raw_probe.rs"
required-features = ["raw"]

[[bin]]
name = "antitone-calibration-probe"
path = "src/bin/calibration_probe.rs"
required-features = ["raw"]

[[bin]]
name = "antitone-gpu-probe"
path = "src/bin/gpu_probe.rs"
required-features = ["gpu"]

[[bin]]
name = "antitone-scan-probe"
path = "src/bin/scan_probe.rs"
required-features = ["raw"]

[[bin]]
name = "antitone-export-probe"
path = "src/bin/export_probe.rs"
required-features = ["raw", "export"]

[[bin]]
name = "antitone-rendering-probe"
path = "src/bin/rendering_probe.rs"
required-features = ["render"]

[[bin]]
name = "antitone-presentation-probe"
path = "src/bin/presentation_probe.rs"
required-features = ["ui"]

[profile.release]
lto = "thin"
