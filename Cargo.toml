[package]
name = "antitone"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace]
members = ["scripts/xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
log = { version = "=0.4.34", features = ["std", "kv"] }
glam = { version = "=0.34.1", default-features = false, features = ["std", "f64"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "metal", "dx12", "vulkan", "glsl", "wgsl"] }
pollster = { version = "=1.0.1", optional = true }
bytemuck = { version = "=1.25.2", optional = true, features = ["derive"] }

egui = { version = "=0.36.2", optional = true }
egui_kittest = { version = "=0.36.2", optional = true, default-features = false, features = ["wgpu"] }
egui-winit = { version = "=0.36.2", optional = true, default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "=0.36.2", optional = true, default-features = false }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06"] }
half = { version = "=2.7.1", optional = true }
lcms2 = { version = "=6.2.0", optional = true, default-features = false, features = ["static"] }
tiff = { version = "=0.11.3", optional = true }
exr = { version = "=1.74.2", optional = true }
tempfile = { version = "=3.27.0", optional = true }
libc = { version = "=0.2.190", optional = true }
rfd = { version = "=0.17.2", optional = true, default-features = false }
serde = { version = "=1.0.229", optional = true, features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", optional = true, features = ["float_roundtrip"] }
blake3 = { version = "=1.8.7", optional = true }
base64 = { version = "=0.22.1", optional = true }
flate2 = { version = "=1.1.10", optional = true, default-features = false, features = ["rust_backend"] }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["jpeg", "png"] }
async-executor = { version = "=1.13.1", optional = true }
async-lock = { version = "=3.4.0", optional = true }
event-listener = { version = "=5.4.0", optional = true }
futures-lite = { version = "=2.6.1", optional = true }
futures-channel = { version = "=0.3.32", optional = true, default-features = false, features = ["std"] }
blocking = { version = "=1.6.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.2", optional = true, default-features = false }
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow", "NSScreen", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphicsContext"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSData", "NSArray", "NSDate", "NSObject", "NSObjCRuntime", "NSString", "NSRunLoop"] }
objc2-metal = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "MTLDevice"] }
objc2-core-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CGColorSpace"] }
objc2-quartz-core = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CAMetalLayer", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
# Windows diagnostics read the Vulkan HAL's live buffer/texture allocation counters.
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["counters"] }
ash = { version = "=0.38.0", optional = true, default-features = false }
muda = { version = "=0.21.2", optional = true, default-features = false }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[features]
ui-tests = ["editor", "ocio-reference", "dep:egui_kittest", "image/png"]
logging = ["dep:serde_json", "dep:tempfile"]
editor = ["logging", "ui", "raw", "dng-sdk", "export", "project", "dep:rfd", "dep:blake3", "dep:image", "dep:async-lock", "dep:event-listener", "dep:futures-lite", "dep:blocking"]
project = ["dep:serde", "dep:serde_json", "dep:tempfile", "dep:blake3", "dep:base64", "dep:flate2", "dep:libc", "glam/serde"]
ui = ["gpu", "dep:egui", "dep:egui-winit", "dep:egui-wgpu", "dep:winit", "dep:half", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-quartz-core", "dep:objc2-foundation", "dep:muda", "dep:async-executor", "dep:futures-channel"]
raw = ["dep:cc", "dep:libc", "dep:blake3"]
# Direct SDK remains separately usable without LibRaw or the desktop stack.
dng-sdk = ["dep:cc", "dep:blake3", "dep:tempfile"]
render = ["dep:lcms2"]
ocio-reference = ["render", "dep:cc"]
export = ["render", "dep:tiff", "dep:exr", "dep:tempfile", "dep:libc", "dep:half"]
gpu = ["dep:wgpu", "dep:ash", "dep:pollster", "dep:bytemuck", "dep:objc2-metal", "dep:blake3", "glam/bytemuck"]

[dev-dependencies]
# Device-free shader validation: the same naga the GPU backends use.
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }

[build-dependencies]
cc = { version = "=1.2.62", optional = true }

[target.'cfg(windows)'.build-dependencies]
# Embeds the application icon and version details in the executable.
embed-resource = "=3.0.12"

[lib]
path = "src/lib.rs"

[[bin]]
name = "antitone"
path = "src/bin/antitone.rs"
required-features = ["editor"]

[[bin]]
name = "antitone-raw-probe"
path = "src/bin/raw_probe.rs"
required-features = ["raw"]

[[bin]]
name = "antitone-dng-probe"
path = "src/bin/dng_probe.rs"
required-features = ["dng-sdk"]

[[bin]]
name = "antitone-camera-reference"
path = "scripts/camera-reference.rs"
required-features = ["raw", "gpu"]

[[bin]]
name = "antitone-gpu-probe"
path = "src/bin/gpu_probe.rs"
required-features = ["gpu"]

[[bin]]
name = "antitone-rendering-probe"
path = "src/bin/rendering_probe.rs"
required-features = ["ocio-reference"]

[[bin]]
name = "antitone-presentation-probe"
path = "src/bin/presentation_probe.rs"
required-features = ["ui"]

[[test]]
name = "native_host"
path = "tests/native_host.rs"
harness = false
required-features = ["ui"]

[[test]]
name = "native_executor"
path = "tests/native_executor.rs"
harness = false
required-features = ["ui"]

[[test]]
name = "native_menus"
path = "tests/native_menus.rs"
harness = false
required-features = ["ui"]

[[test]]
name = "native_termination"
path = "tests/native_termination.rs"
harness = false
required-features = ["ui"]

[profile.release]
lto = "thin"
